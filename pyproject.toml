[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lftomo"
dynamic = ["version"]
description = "Large-format tomography reconstruction utilities."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
	"numpy",
	"bottleneck>=1.6.0",
	"click",
	"psutil",
	"h5py",
	"tifffile",
	"scipy",
	"PyWavelets",
	"numexpr",
	"natsort",
	"opencv-python",
	"scikit-image",
	"pydantic>=2",
	"cattrs>=24",
	"PyYAML",
	"packaging",
]

[project.scripts]
lftomo-run = "lftomo.runner:main"
lftomo-experiment = "lftomo.experiment.cli:main"
lftomo-acceptance = "lftomo.acceptance:main"

[project.optional-dependencies]
bac = [
	"hotopy",
]
tomopy = [
	"tomopy>=1.15.3",
]
dev = [
	"pytest",
	"coverage",
]
docs = [
	"mkdocs",
	"mkdocs-jupyter>=0.25",
	"mkdocstrings[python]",
	"pymdown-extensions",
]
super-resolution = [
	"torch",
]
neuroglancer = [
	"cloud-volume",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# ``vX.Y.Z`` tags are the single source of truth. Untagged builds (the release
# branch before its tag, or a shallow/archive checkout) resolve to this floor so
# the wheel is still buildable; a real tag always overrides it.
version_scheme = "no-guess-dev"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["lftomo"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
markers = [
	"integration: requires local lab data or hardware; skipped unless --run-integration is set",
	"system: end-to-end, reference-parity, or real-engine test outside the unit suite; skipped unless --run-system is set",
	"tier2: requires lab-internal Tier-2 reference data; skipped unless --run-tier2 is set",
]
