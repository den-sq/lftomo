[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lftomo"
version = "0.1.0"
description = "Large-format tomography reconstruction utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy",
	"click",
	"psutil",
	"h5py",
	"tifffile",
	"scipy",
	"PyWavelets",
	"numexpr",
	"natsort",
	"opencv-python",
	"scikit-image",
	"pydantic>=2",
	"PyYAML",
	"packaging",
]

[project.scripts]
lftomo-run = "lftomo.runner:main"
lftomo-experiment = "lftomo.experiment.cli:main"

[project.optional-dependencies]
bac = [
	"hotopy",
]
tomopy = [
	"tomopy>=1.15.3",
]
dev = [
	"pytest",
	"coverage",
]
docs = [
	"mkdocs",
	"mkdocs-jupyter",
	"mkdocstrings[python]",
]
super-resolution = [
	"torch",
]
neuroglancer = [
	"cloud-volume",
]

[tool.hatch.build.targets.wheel]
packages = ["lftomo"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
markers = [
	"integration: requires local lab data or hardware; skipped unless --run-integration is set",
	"tier2: requires lab-internal Tier-2 reference data; skipped unless --run-tier2 is set",
]
