[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lftomo"
version = "0.1.0"
description = "Large-format tomography reconstruction utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy",
	"click",
	"psutil",
	"h5py",
	"tifffile",
	"tomopy",
	"scipy",
	"PyWavelets",
	"numexpr",
	"natsort",
	"scikit-image",
]

[project.optional-dependencies]
dev = [
	"pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["lftomo"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
