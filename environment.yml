name: lftomo
channels:
  - conda-forge
  - bioconda
  - astra-toolbox
  - defaults
dependencies:
  - python>=3.11
  # TomoPy 1.14 still uses NumPy 1.x copy semantics internally.
  - numpy<2
  - click
  - psutil
  - h5py
  - tifffile
  - tomopy
  - scipy
  - pywavelets
  - numexpr
  - natsort
  - scikit-image
  - pydantic>=2
  - pyyaml
  - pytest
  - hatchling
  - mkdocs
  - mkdocs-jupyter
  - mkdocstrings
  - mkdocstrings-python
  - pip
  - pip:
      - hotopy
