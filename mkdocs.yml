site_name: "lftomo: Library for Large-format Tomography Computation"

nav:
 - Home: index.md
 - Plans:
   - Survey: recon-survey.md
   - Unification plan: recon-unification-plan.md
   - Buildout: Buildout.md
 - Operations:
   - Recon-data runner: recon-data-runner.md
   - Calibration bundles: calibration-bundles.md
   - Candidate spaces: candidate-spaces.md
   - Stripe-chain invariant: stripe-chain-regression.md
 - API reference:
   - Configuration models: api/config.md
   - Pipeline: api-pipeline.md

plugins:
  - mkdocs-jupyter
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source

theme: readthedocs

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - js/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
