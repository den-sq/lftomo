# Producer: ReconChengLab/phase_contrast/recon_v1.py
# Survey source: docs/recon-survey.md lines 191-235 (canonical pipeline narration).
# Representative defaults follow the INI-driven ALS/B10 path; disabled optional
# steps remain present so their exact position cannot drift.
pipeline_template: phase-contrast-canonical
output_path: reference/phase_contrast/recon
metadata:
  producer: phase_contrast
  representative_dataset: phase_contrast_hdf5
pipeline:
  - kind: read
    algorithm: hdf5_dxchange
    params: {order: sinogram, calibration_policy: required}
  - kind: normalize
    algorithm: taper_blended
    params: {pre_weight: linear, post_weight: linear}
  - kind: geometry
    algorithm: helical_pitch
    params: {enabled_from_scan: true}
  - kind: geometry
    algorithm: affine_skew
    params: {degrees: 0.0}
  - kind: geometry
    algorithm: movement
    params: {enabled: false, y: 0.0, x: 0.0}
  - kind: stripe
    algorithm: all_of_the_stripe_removal
    params: {wavelet: db25, sigma: 2.4, sorting_size: 31, filtering_size: 31}
  - kind: phase
    algorithm: bronnikov_aided
    params: {enabled: true, alpha: 0.0006, gamma_from_scan: true}
  - kind: filter
    algorithm: bilateral
    params: {enabled: false, diameter: 5, sigma_color: 75, sigma_space: 75}
  - kind: center
    algorithm: manual
    params: {pc_fallback: true, vo_fallback: true}
  - kind: recon
    algorithm: gridrec
    params: {ncore_from_machine: true}
  - kind: write
    algorithm: tiff_slices
    params: {dtype: float32, naming_template: "{sample_id}_{slice:05d}"}
