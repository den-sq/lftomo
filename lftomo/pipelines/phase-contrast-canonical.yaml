# Producer: ReconChengLab/phase_contrast/recon_v1.py
# Survey source: docs/recon-survey.md lines 191-235 (canonical pipeline narration).
# Representative defaults follow the completed AAA523 ALS B8 TIFF run at
# ReconChengLab@6791a4a. Disabled optional steps remain present so their exact
# position cannot drift. BAC occurs during inline sinogram generation, before
# skew, movement, and the later chunk-level stripe pass.
pipeline_template: phase-contrast-canonical
output_path: reference/phase_contrast/recon
metadata:
  producer: phase_contrast
  representative_dataset: phase_contrast_tiff
pipeline:
  - kind: read
    algorithm: tiff_stack
    params: {order: projection, pattern: "proj_*.tif", projection_count: 1969, sinogram_chunk_size: 140, chunk_overlap: 30}
  - kind: normalize
    algorithm: taper_blended
    params: {pre_gain: gains/gain.tif, post_gain: gains/gain_post.tif, pre_dark: gains/dark.tif, post_dark: gains/dark_post.tif, pre_weight: linear, post_weight: linear, floor_nonpositive: true, floor_value: 1.0}
  - kind: geometry
    algorithm: helical_pitch
    params: {enabled: false, vertical_velocity_px: 0, going_up: false}
  - kind: phase
    algorithm: bronnikov_aided
    params: {enabled: true, alpha: 2.0, gamma: 1.25, invert: false, clip_input: true, clip_minimum: 1.0e-9, clip_threshold: 2.0, clip_high_value: 1.0}
  - kind: filter
    algorithm: bilateral
    params: {enabled: false, diameter: 3, sigma_color: 1, sigma_space: 1}
  - kind: geometry
    algorithm: affine_skew
    params: {degrees: 0.149, center_px: 2216.0, interpolation: cubic}
  - kind: geometry
    algorithm: movement
    params: {enabled: false, y: -28.83299763005425, x: -3.0}
  - kind: stripe
    algorithm: fw
    params: {wavelet: db25, sigma: 2.4}
  - kind: center
    algorithm: manual
    params: {value_px: 2216.0, find_center: false, pc_fallback: false, vo_fallback: false}
  - kind: recon
    algorithm: gridrec
    params: {ncore_from_machine: true, edge_buffer_left: 100, edge_buffer_right: 100, edge_buffer_input: true, circle_mask: false, angle_endpoint: true}
  - kind: write
    algorithm: tiff_slices
    params: {dtype: float32, naming_template: "rec_{slice:05d}.tif", write_full: true, write_bin2: false, write_bin4: false}
