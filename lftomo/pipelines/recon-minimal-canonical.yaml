# Producer: dan_scripts/recon_minimal.py
# Survey source: docs/recon-survey.md lines 22-58 (function/line-number narration).
# These are the Click defaults for the representative non-helical TIFF path.
pipeline_template: recon-minimal-canonical
output_path: reference/recon_minimal/recon
metadata:
  producer: recon_minimal
  representative_dataset: striping_tiff
pipeline:
  - kind: read
    algorithm: tiff_stack
    params: {order: sinogram}
  - kind: normalize
    algorithm: weighted
    params: {pre_sub: false}
  - kind: stripe
    algorithm: vo_family
    params:
      order: [remove_dead_vo, remove_large_vo, remove_sort_vo]
      size: 31
      snr: 3.0
  - kind: geometry
    algorithm: affine_skew_movement
    params: {skew_degrees: 0.0, movement_enabled: false, transition_to: projection, pad_x: 0}
  - kind: phase
    algorithm: paganin
    params: {enabled: true, alpha: 0.06, pad_y: true}
  - kind: center
    algorithm: vo
    params: {fallback: entropy_local, tilt_fit: polynomial}
  - kind: recon
    algorithm: gridrec
    params: {iterations: 1}
  - kind: write
    algorithm: tiff_slices
    params: {dtype: float32, naming_template: "{sample_id}_{slice:05d}"}
