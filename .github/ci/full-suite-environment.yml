name: lftomo-full-suite

channels:
  - conda-forge
  - nodefaults

# This lane exercises the supported runtime without docs or unrelated optional
# algorithms. Keep these runtime packages aligned with [project].dependencies;
# names differ where conda-forge and PyPI use different package names.
dependencies:
  - python=3.12
  - numpy
  - bottleneck>=1.6.0
  - click
  - psutil
  - h5py
  - tifffile
  - tomopy>=1.15.3
  # GitHub's hosted runner is CPU-only. Without this build constraint the
  # solver currently prefers libtomo's CUDA variant and downloads unused CUDA.
  - libtomo >=1.15.3 h*
  - scipy
  - pywavelets
  - numexpr
  - natsort
  - opencv
  - scikit-image
  - pydantic>=2
  - pyyaml
  - packaging
  - pytest
  - hatchling
  - hatch-vcs
  - pip
