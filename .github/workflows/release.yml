name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Build and publish tagged release
        runs-on: ubuntu-latest

        steps:
            - name: Check out tagged source
              uses: actions/checkout@v7
              with:
                  # hatch-vcs derives the version from the tag; it needs full
                  # history and the tag itself, not a shallow clone.
                  fetch-depth: 0

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.11'

            - name: Build sdist and wheel
              run: |
                  python -m pip install --upgrade build
                  python -m build

            - name: Verify the built version matches the tag
              run: |
                  python - <<'PY'
                  import os
                  from pathlib import Path
                  tag = os.environ["GITHUB_REF_NAME"]
                  expected = tag[1:] if tag.startswith("v") else tag
                  wheels = list(Path("dist").glob("*.whl"))
                  assert wheels, "no wheel was built"
                  built = wheels[0].name.split("-")[1]
                  assert built == expected, f"built version {built!r} != tag {expected!r}"
                  print(f"OK: built {built} matches tag {tag}")
                  PY

            - name: Publish GitHub Release with artifacts
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
