name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  light-tests:
    name: Lightweight unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          click numpy psutil "pydantic>=2" PyYAML scipy pytest

      - name: Run lightweight unit tests
        shell: bash
        run: |
          test_paths=(
            tests/pipeline/test_sweep.py
            tests/pipeline/test_validation.py
            tests/experiment/test_models.py
            tests/experiment/test_prefix_cache.py::test_prefix_planning_is_deterministic_visible_and_fail_closed
            tests/experiment/test_prefix_cache.py::test_cached_forks_are_concurrent_deeply_isolated_and_failure_safe
            tests/experiment/test_prefix_cache.py::test_nonmutating_suffix_uses_read_only_map_and_unknown_identity_bypasses
            tests/experiment/test_prefix_cache.py::test_initial_working_array_content_is_part_of_cache_identity
            tests/experiment/test_prefix_cache.py::test_invalidation_corruption_recovery_eviction_and_sampled_verification
            tests/experiment/test_prefix_cache.py::test_bounds_bypass_before_cache_creation
            tests/evaluation/test_aggregation_ranking.py
          )
          existing_test_paths=()
          for test_path in "${test_paths[@]}"; do
            test_file="${test_path%%::*}"
            if [[ -f "$test_file" ]]; then
              existing_test_paths+=("$test_path")
            fi
          done
          python -m pytest -q "${existing_test_paths[@]}"
