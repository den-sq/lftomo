name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  tests:
    name: Packaging and import smoke tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up lftomo conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: lftomo
          environment-file: environment.yml
          auto-activate-base: false
          use-mamba: true

      - name: Install lftomo package metadata
        run: python -m pip install --no-deps -e .

      - name: Validate pyproject metadata
        run: >-
          python -c
          "import pathlib, tomllib;
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text());
          assert data['build-system']['build-backend'] == 'hatchling.build';
          assert data['project']['name'] == 'lftomo';
          assert data['project']['requires-python'] == '>=3.11'"

      - name: Run import smoke tests
        run: python -m pytest tests/test_imports.py -q
