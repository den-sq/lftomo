name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  light-tests:
    name: Lightweight unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          "numpy<2" "pydantic>=2" PyYAML scipy pytest

      - name: Run lightweight unit tests
        shell: bash
        run: |
          test_paths=(
            tests/pipeline/test_sweep.py
            tests/pipeline/test_validation.py
            tests/experiment/test_models.py
            tests/evaluation/test_aggregation_ranking.py
          )
          existing_test_paths=()
          for test_path in "${test_paths[@]}"; do
            if [[ -f "$test_path" ]]; then
              existing_test_paths+=("$test_path")
            fi
          done
          python -m pytest -q "${existing_test_paths[@]}"
