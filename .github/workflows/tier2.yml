name: Recon-data Tier-2 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reference-data:
    runs-on: [self-hosted, recon-data]
    timeout-minutes: 240
    env:
      LFTOMO_RUNNER_CAPABILITY: recon-data
    steps:
      - uses: actions/checkout@v7
      - name: Install the checkout without replacing the runner environment
        run: >-
          python -m pip install --no-deps -e .
      - name: Verify the numerical runtime
        run: >-
          python -c
          "import hotopy, numpy as np, tomopy;
          from packaging.version import Version;
          from lftomo.pipeline.runtime import collect_libtomo_identity, tomopy_numpy_incompatible;
          libtomo = collect_libtomo_identity();
          assert libtomo is not None and not libtomo.gridrec_fixed,
          f'Tier-2 references require stock libtomo from environment-legacy.yml, found {libtomo}';
          assert Version(tomopy.__version__) >= Version('1.15.3'),
          f'environment-legacy.yml requires TomoPy >=1.15.3, found {tomopy.__version__}';
          assert not tomopy_numpy_incompatible(np.__version__, tomopy.__version__),
          f'Incompatible NumPy {np.__version__} / TomoPy {tomopy.__version__} runtime';
          print(f'NumPy {np.__version__}, TomoPy {tomopy.__version__}, Hotopy available')"
      - name: Validate canonical datasets and reproduce frozen references
        env:
          LFTOMO_TIER2_REPORT_DIR: tier2-reports
        run: >-
          python -m pytest
          tests/test_tier2_datasets.py
          tests/test_tier2_numerical.py
          --run-tier2 -ra
      - name: Upload numerical comparison records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier2-numerical-reports
          path: tier2-reports/*.json
          if-no-files-found: warn
