name: Tier-2 dataset validation

on:
  workflow_dispatch:

jobs:
  validate-reference-data:
    runs-on: [self-hosted, yarrkha]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the checkout without replacing the runner environment
        run: python -m pip install --no-deps -e .
      - name: Validate canonical datasets and reference slots
        run: python -m pytest tests/test_tier2_datasets.py --run-tier2
