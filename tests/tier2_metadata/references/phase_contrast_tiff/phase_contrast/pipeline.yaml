schema_version: 1
resolved_from: phase-contrast-canonical@6791a4a57ec6e12cfa5d00e675c9bfc262cccac1
output_path: reference/phase_contrast/recon
metadata:
  producer: phase_contrast
  dataset: phase_contrast_tiff
pipeline:
  - kind: read
    algorithm: tiff_stack
    params: {path: projections, pattern: "proj_*.tif", order: projection, projection_count: 1969, sinogram_chunk_size: 140, chunk_overlap: 30}
  - kind: normalize
    algorithm: taper_blended
    params: {pre_gain: gains/gain.tif, post_gain: gains/gain_post.tif, pre_dark: gains/dark.tif, post_dark: gains/dark_post.tif, gain_averaging: true, gain_movement_enabled: false}
  - kind: geometry
    algorithm: helical_pitch
    params: {enabled: false, vertical_velocity_px: 0, going_up: false}
  - kind: phase
    algorithm: bronnikov_aided
    params: {enabled: true, alpha: 2.0, gamma: 1.25, invert: false}
  - kind: filter
    algorithm: bilateral
    params: {enabled: false, diameter: 3, sigma_color: 1, sigma_space: 1}
  - kind: geometry
    algorithm: affine_skew
    params: {degrees: 0.149, center_px: 2216.0, interpolation: cubic}
  - kind: geometry
    algorithm: movement
    params: {enabled: false, y: -28.83299763005425, x: -3.0}
  - kind: stripe
    algorithm: fw
    params: {wavelet: db25, sigma: 2.4}
  - kind: center
    algorithm: manual
    params: {value_px: 2216.0, find_center: false}
  - kind: recon
    algorithm: gridrec
    params: {edge_buffer_left: 100, edge_buffer_right: 100, output_width: 4808}
  - kind: write
    algorithm: tiff_slices
    params: {dtype: float32, naming_template: "rec_{slice:05d}.tif", write_full: true, write_bin2: false, write_bin4: false}
