schema_version: 1
resolved_from: r254-canonical@AAA592
output_path: reference/r254/recon
metadata:
  producer: r254
  dataset: striping_tiff
  source_variant: R2.54_Berkeley8_hpc_v1.81_alt.py
pipeline:
  - kind: read
    algorithm: tiff_stack
    params:
      path: projections
      pattern: "proj_*.tif"
      order: projection
      theta_count: 3937
      theta_start_degrees: 0.0
      theta_stop_degrees: 180.0
  - kind: normalize
    algorithm: theta_switch
    params:
      gain_averaging: true
      pre_gain: reference/r254/gains/gain.tif
      post_gain: reference/r254/gains/gain_post.tif
      pre_dark: reference/r254/gains/dark.tif
      post_dark: reference/r254/gains/dark_post.tif
      pre_subtracted: false
  - kind: phase
    algorithm: bronnikov_aided
    params: {alpha: 2.4, gamma: 1.2}
  - kind: geometry
    algorithm: affine_skew_movement
    params:
      skew_degrees: 0.0
      movement_enabled: false
      movement_y: 0.26351930523856
      movement_x: -1.707958799447738
  - kind: stripe
    algorithm: fw
    params: {wavelet: db25, sigma: 2.4, ncore: 12}
  - kind: stripe
    algorithm: vo_sort
    params: {size: 21, ncore: 12}
  - kind: center
    algorithm: manual
    params: {value_px: 6235.0, find_center: false}
  - kind: recon
    algorithm: gridrec
    params: {ncore: 32, sinogram_order: false, circle_mask: false}
  - kind: write
    algorithm: tiff_slices
    params: {dtype: float32, naming_template: "rec_{slice:05d}.tif"}
